<style>
/* Image2Code additions on top of the shared docs.css */
.side { display: flex; flex-direction: column; }
.side .dl { margin-top: auto; justify-content: center; border: 1px solid var(--line); }
@media (max-width: 760px) { .side { flex-direction: row; } .side .dl { margin-top: 0; margin-left: 8px; flex: none; } .side .dl span { display: none; } }

.refs-label { margin: 24px 0 8px; }
.refs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.refs a { text-decoration: none; display: block; color: var(--ink); }
.refs img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.refs a:hover img { border-color: #4A4A4A; }
.refs .label { display: block; margin-top: 6px; }
@media (max-width: 479px) { .refs { grid-template-columns: 1fr 1fr; } }

.doc p.note { color: var(--ink-2); margin: 0 0 4px; max-width: 68ch; }
table.rubric td.n { white-space: nowrap; font: 400 12px/1.6 var(--mono); color: var(--ink-2); width: 1%; }
table.rubric td.mono { font: 400 12.5px/1.6 var(--mono); color: var(--ink-2); white-space: nowrap; }
table.rubric td.src a { text-decoration: none; }
table.rubric td.grow { width: auto; }
table.plain td:first-child { width: auto; }
table.rubric tr.gate td { background: rgba(63, 140, 232, .06); }
table.rubric tr.real td { background: rgba(232, 190, 63, .05); }
table.rubric tr.dis td { background: rgba(248, 113, 113, .07); }
table.rubric tr.dis td:first-child { box-shadow: inset 2px 0 0 #F87171; }
table.rubric.judge td.c { text-align: center; white-space: nowrap; }
table.rubric.judge th:nth-child(n+2):nth-child(-n+5) { width: 84px; white-space: normal; text-align: center; }
table.rubric.judge th:first-child { width: 30%; }
table.rubric.judge td.cm { width: 45%; }
table.rubric.judge .cl .src { margin-right: 4px; }
.page-filter { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 0; cursor: pointer; }
.only-dis tr.agree { display: none; }
.legend { display: flex; gap: 16px; margin: 12px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.sub-h { margin: 22px 0 0; }

/* reference vs render slider */
.slider { position: relative; margin-top: 12px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); user-select: none; touch-action: none; cursor: ew-resize; }
.slider img { display: block; width: 100%; height: auto; pointer-events: none; }
.slider .top { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos, 50%)); }
.slider .bar { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; margin-left: -1px; background: #fff; }
.slider .knob { position: absolute; top: 50%; left: var(--pos, 50%); width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(20, 20, 20, .75); border: 1.5px solid #fff; display: grid; place-items: center; color: #fff; }
.slider .tag { position: absolute; top: 10px; padding: 3px 7px; border-radius: 4px; background: rgba(14, 18, 21, .78); color: var(--ink); }
.slider .tag.l { left: 10px; } .slider .tag.r { right: 10px; }

/* the prompt sent with the reference photo */
.prompt { display: flex; gap: 14px; align-items: center; margin: 16px 0 20px; padding: 12px 14px; background: var(--side); border: 1px solid var(--line); border-radius: 8px; }
.prompt img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; flex: none; }
.prompt p { margin: 4px 0 0; font-size: 15px; color: var(--ink); }

/* loading state on the scene frames */
.frame .loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #04070A; transition: opacity .4s ease; pointer-events: none; }
.frame .loading.done { opacity: 0; }
.frame .spin { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #2A2A2A; border-top-color: var(--ink-2); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .frame .spin { animation-duration: 2.4s; } }
</style>

e", "c": "There is no UI, text or interaction other than orbiting", "mh": false, "mc": false, "mhc": "There's a non-solicited UI. A control panel with three sliders and two camera buttons.", "mcc": "The page displays a prominent HUD overlay with title text, sliders, mode buttons, and a Hide Controls button.", "rh": true, "rc": true, "rhc": "No UI or text. The only interaction is orbiting.", "rcc": "No UI, text, or interactive elements other than camera orbiting are shown in normal viewing."}, {"n": "2", "d": "Prompt Adherence", "c": "At least one environmental motion runs on load, without any input", "mh": true, "mc": true, "mhc": "Some water ripples are running. Not sure if clouds are moving.", "mcc": "Water ripples and sky clouds animate continuously on load via the uTime shader uniform.", "rh": true, "rc": true, "rhc": "Water ripples, slow cloud morphing and some trees moving to the wind.", "rcc": "Water ripples and forest wind gusts animate automatically from page load via an elapsed-time clock."}, {"n": "3", "d": "Composition", "c": "The default view matches the photo's camera angle and framing (horizon height, lake in the lower part, peaks across the top)", "mh": false, "mc": true, "mhc": "Feels a bit closer than the picture frame, like if we're using a zoom lens.", "mcc": "The default camera position and target frame the foreground lake, left cliff, right forested shore, and background peaks closely matching the photo.", "rh": true, "rc": true, "rhc": "Same horizon height, lake in the lower part, peaks across the top.", "rcc": "The default camera position, target, and field of view are calibrated directly to the reference photo's framing and horizon height."}, {"n": "4", "d": "Reference Fidelity", "c": "The lake water is glacial turquoise, as in the photo", "mh": false, "mc": true, "mhc": "Lake is teal-ish, not the bright saturated turquoise of the photo.", "mcc": "The water shader mixes deep glacial teal and mid-turquoise hues with planar reflections to achieve the photo's glacial turquoise look.", "rh": true, "rc": true, "rhc": "It fits the photo, it's bright turquoise.", "rcc": "The water shader renders the lake in rich glacial turquoise calibrated to match the reference photo."}, {"n": "5", "d": "Reference Fidelity", "c": "A row of jagged peaks spans the background, matching the photo's skyline", "mh": false, "mc": true, "mhc": "The skyline is a row of spaced cones, not the photo's jagged profile.", "mcc": "Ten sculpted mountain peaks with ridged noise span the background horizon in an arrangement calibrated to the photo's skyline.", "rh": true, "rc": true, "rhc": "The skyline comes from the real terrain of the Ten Peaks and matches the photo peak by peak.", "rcc": "The 3D terrain mesh recreates the full jagged Valley of the Ten Peaks skyline across the background."}, {"n": "6", "d": "Reference Fidelity", "c": "Snow or ice shows on the peaks where it appears in the photo", "mh": false, "mc": true, "mhc": "It has some white patches on each peak, but it doesn't look like snow. They have the same texture as the peaks.", "mcc": "Procedural snow caps, high shelf streaks, cirque patches, and the central diagonal snow couloir match the snow placement in the photo.", "rh": true, "rc": true, "rhc": "Snow on the summit caps, ledges, couloir and base fields, where the photo has it.", "rcc": "Snow ledges, gullies, and the central diagonal couloir are placed on the peaks to match the photo."}, {"n": "7", "d": "Reference Fidelity", "c": "Conifer forest lines the shore where it does in the photo", "mh": true, "mc": true, "mhc": "Conifers line the right shore which is right. However they also show up in the far end of the lake in a wrong proportion, not respecting the depth of field.", "mcc": "Dense instanced conifers cover the right peninsula, the far valley sill, and sparse ledges on the left shore just as in the photo.", "rh": true, "rc": true, "rhc": "Dense conifer forest on the right shore and smaller in the far center, as in the photo.", "rcc": "Instanced conifer forests line the right lakeshore, central valley base, and left slope toe just as in the photo."}, {"n": "8", "d": "Reference Fidelity", "c": "Time of day and light match the photo (sunrise light on the peaks)", "mh": true, "mc": true, "mhc": "Pink sunrise sky with warm light on the peak tips.", "mcc": "Warm low-angle sunrise alpenglow illuminates the high peaks and coral clouds on the right while lower slopes sit in cool dawn shade.", "rh": true, "rc": true, "rhc": "Sunrise light, the two end tips glow orange, the rest of the range is warm and the sky is pink and orange.", "rcc": "Low-angle warm sunrise alpenglow illuminates the rightmost summit and left peak tip under pink-lit clouds."}, {"n": "9", "d": "Scene Fidelity", "c": "Mountains read as rock faces with ridges and gullies, not smooth cones", "mh": false, "mc": true, "mhc": "Peaks read as smooth cones with stripes, no ridges or gullies.", "mcc": "Ridged multi-octave noise, vertical erosion gullies, couloir carving, and procedural strata bump-mapping make the peaks read as craggy rock faces.", "rh": true, "rc": true, "rhc": "Real rock with buttresses, ledges, couloirs and gullies.", "rcc": "The mountains feature displaced rock strata, vertical fractures, gullies, and scanned cliff textures rather than smooth cones."}, {"n": "10", "d": "Scene Fidelity", "c": "Trees read as individual conifers of varied heights", "mh": true, "mc": true, "mhc": "Tiered trees of varied height read as individual trees.", "mcc": "Each instanced spruce has six jittered conical branch tiers and randomized height and width scaling.", "rh": true, "rc": true, "rhc": "Individual trees of varied height built from scanned fir branches.", "rcc": "Instanced conifers use an 8-variant spruce atlas with random mirroring and per-tree height, width, and lean variations."}, {"n": "11", "d": "Scene Fidelity", "c": "The shoreline has rocks or debris where water meets land (no knife-edge line)", "mh": false, "mc": false, "mhc": "The shoreline is a clean knife edge where the terrain meets the water, with no rocks or debris.", "mcc": "There are no 3D rocks, boulders, or debris meshes along the waterline, leaving a clean geometric intersection between the flat water plane and smooth terrain.", "rh": true, "rc": true, "rhc": "A thin band of wet stones runs along the right shore, and the talus meets the water with a soft edge.", "rcc": "3D rock, rubble, and fallen log meshes along with procedural stones and wet stone bands break up the water's edge."}, {"n": "12", "d": "Scene Fidelity", "c": "When orbited, there are no floating objects, holes or visible scene edges", "mh": false, "mc": false, "mhc": "Orbiting shows trees floating in the air above the lake and the cut edges of the terrain.", "mcc": "Orbiting around reveals the hard rectangular boundaries of the finite water plane (1050x760) and open terrain patches on the south/camera side where no mountains enclose the lake.", "rh": true, "rc": true, "rhc": "Within the orbit limits there are no holes, floating parts or scene edges. Checked at both ends.", "rcc": "Props are partially embedded into the ground, decal terrain pieces have shaded side skirts, and bounded orbiting avoids holes or scene edges."}, {"n": "13", "d": "Lighting", "c": "Peaks catch warm, low-angle sun while the valley and forest sit in cooler shade", "mh": true, "mc": true, "mhc": "Peak tips catch warm light while the valley and forest sit in cooler shade.", "mcc": "Elevation and directional masks apply warm golden-orange sunrise light to the upper peaks while keeping the left cliff, valley floor, and forest in cool twilight shadow.", "rh": true, "rc": true, "rhc": "Warm low sun on the peaks while the left wall, the valley and the forest sit in cool shade.", "rcc": "High summits catch warm orange-gold sunlight while the foreground cliff, forest, and valley sit in cooler shade."}, {"n": "14", "d": "Lighting", "c": "Distant peaks are hazier and bluer than near ones (atmospheric perspective)", "mh": false, "mc": true, "mhc": "All peaks seem to be at the same distance, no depth of field.", "mcc": "An exponential distance fog function blends distant terrain toward cool slate-blue and dusty rose atmospheric haze.", "rh": true, "rc": true, "rhc": "Distance haze makes the far peaks lighter and softer than the near left wall.", "rcc": "Distance-based atmospheric haze shifts the farther background ridges toward cooler mauve-blue tones compared to the near dark-brown rock."}, {"n": "15", "d": "Lighting", "c": "No area of the default view is fully black or blown out to white", "mh": true, "mc": true, "mhc": "No pure black or blown white areas in the default view.", "mcc": "Hemisphere ambient fill prevents pure black shadows and ACES Filmic tone mapping keeps bright snow and alpenglow highlights from clipping to flat white.", "rh": true, "rc": true, "rhc": "The forest is very dark but keeps detail, and the snow is not clipped.", "rcc": "Shoulder highlight compression, lifted shadows, and clamped material values prevent pure black crushes or blown-out white regions."}, {"n": "16", "d": "Lighting", "c": "Trees and rocks are grounded by contact shadows", "mh": false, "mc": false, "mhc": "No. Trees and rocks sit on the ground with no contact shadow.", "mcc": "Shadow mapping and contact shadows are completely absent, so trees have no grounding shadows on the terrain.", "rh": true, "rc": true, "rhc": "Yes, trees sit on a darkened forest floor.", "rcc": "Trees are grounded by a dark forest-floor mask and shaded bases, while rocks and cliff bases include directional contact shadows and baked AO."}, {"n": "17", "d": "Materials", "c": "The water reflects the mountains and sky", "mh": true, "mc": true, "mhc": "A reflection mirrors the peaks, trees and sky.", "mcc": "A real-time mirrored planar reflection camera renders the mountains, trees, and sky directly onto the lake surface.", "rh": true, "rc": true, "rhc": "Reflection of the peaks, the forest and the pink clouds, with fresnel.", "rcc": "A real-time planar reflection pass renders the inverted mountains, snow, forest, and sky onto the lake surface."}, {"n": "18", "d": "Materials", "c": "The water shows depth: lighter and clearer near the shore, deeper colour further out", "mh": false, "mc": false, "mhc": "The water is darkest near the camera and lighter far away, the opposite of the photo.", "mcc": "Water color only varies along a broad Z-axis gradient and noise swirl without any shoreline depth calculation, so shallow edges are neither lighter nor clearer.", "rh": true, "rc": false, "rhc": "Lighter, clearer cyan near the shore and deeper teal toward the camera.", "rcc": "The water is completely opaque and uses a camera-projected colour grid rather than rendering lighter, clearer shallow water near the shore transitioning to deeper colour further out."}, {"n": "19", "d": "Materials", "c": "Rock surfaces show texture detail at the default view", "mh": false, "mc": true, "mhc": "Rock is smooth with horizontal bands, with no rock texture at the default view.", "mcc": "World-space procedural strata banding and finite-difference normal perturbation give the rock faces visible surface detail.", "rh": true, "rc": true, "rhc": "Scanned rock with fractures is visible at the default view.", "rcc": "Foreground cliffs and scree use multi-scale triplanar scanned rock textures and normal maps while distant faces use crisp high-resolution Cycles bakes."}, {"n": "20", "d": "Materials", "c": "Snow reads as snow (bright and soft, not grey plastic)", "mh": false, "mc": true, "mhc": "Snow is thin white patches.", "mcc": "High-albedo off-white snow blended softly across slopes and couloirs reads naturally under dawn sky and sunrise lighting.", "rh": true, "rc": true, "rhc": "Bright, soft snow sitting on ledges and in the couloir.", "rcc": "Snow patches render with bright, soft rose-warmed diffuse shading and subtle underlying rock relief rather than grey plastic."}, {"n": "21", "d": "Composition", "c": "The horizon is level", "mh": true, "mc": true, "mhc": "The horizon is level.", "mcc": "The camera uses a vertical world up-vector (0, 1, 0) with zero roll, keeping the lake horizon level.", "rh": true, "rc": true, "rhc": "The horizon is level here too.", "rcc": "The water plane lies flat at y = 0 and keeps the far lakeshore horizon level across the view."}, {"n": "22", "d": "Motion", "c": "Ripples move across the water and distort the reflection", "mh": true, "mc": true, "mhc": "Ripples move across the water and distort the reflection.", "mcc": "Animated multi-layer noise normals move across the lake surface and perturb the planar reflection UVs.", "rh": true, "rc": true, "rhc": "Ripples break and shift the reflection, stronger near the camera.", "rcc": "Animated multi-octave ripples, dispersion wave trains, and slow gusts move across the lake and perturb the planar reflection UVs."}, {"n": "23", "d": "Motion", "c": "Mist or low cloud drifts slowly through the scene", "mh": false, "mc": true, "mhc": "Only the high clouds drift. There is no mist or low cloud.", "mcc": "Domain-warped clouds in the sky shader drift slowly across the peaks over time.", "rh": true, "rc": false, "rhc": "The sky clouds drift and change shape slowly above the peaks for the whole video. There is no separate low mist in the valley.", "rcc": "Only static distance haze is applied to the mountains and trees, with no drifting mist or low cloud animated in the scene."}, {"n": "24", "d": "Motion", "c": "Tree tops sway gently in the wind", "mh": false, "mc": false, "mhc": "The trees are static. There is no sway.", "mcc": "The tree shader does not include uTime or any vertex displacement, leaving all trees completely static.", "rh": true, "rc": true, "rhc": "The crowns sway gently and irregularly. Very subtle at the default view.", "rcc": "Upper tree vertices sway gently in traveling multi-scale wind gusts while trunks remain anchored at the base."}, {"n": "25", "d": "Motion", "c": "Motion runs at real-world speed and loops without visible jumps", "mh": true, "mc": true, "mhc": "Cloud drift and ripples run on a continuous clock with no visible jumps.", "mcc": "Continuous procedural noise drift for water ripples and clouds runs at gentle real-world speeds without looping resets or jumps.", "rh": true, "rc": true, "rhc": "Slow, irregular real-time motion, with no visible jumps.", "rcc": "Monotonic elapsed time drives physical wave dispersion and continuous sine-based wind gusts at natural speeds without loop jumps."}, {"n": "26", "d": "Realism", "c": "No repeating texture tiles are visible on the mountains or water", "mh": false, "mc": true, "mhc": "The same horizontal bands repeat across every peak.", "mcc": "Rotated multi-octave procedural noise in world space avoids visible repeating texture tiles on both rock and water.", "rh": true, "rc": true, "rhc": "No repeating texture tiles on the mountains or the water. The near water shows fine ripple lines from the wave shader, not tiled textures.", "rcc": "Dual-scale offset triplanar mapping, full-scene Cycles bakes, and multi-layered FBM ripples eliminate visible texture tiling on rock and water."}, {"n": "27", "d": "Realism", "c": "No identical tree copies sit next to each other", "mh": false, "mc": true, "mhc": "Every tree is the same, changed only in scale and rotation, so identical copies sit next to each other.", "mcc": "Randomized position, Y-rotation, non-uniform XYZ scaling, and color tinting prevent adjacent trees from looking like identical clones.", "rh": true, "rc": true, "rhc": "No twin trees next to each other, they all look different.", "rcc": "Eight tree atlas variants, horizontal flipping, and per-instance height, width, tilt, and tone hashes prevent identical adjacent copies."}, {"n": "28", "d": "Realism", "c": "The camera looks real: natural field of view, no fisheye, post effects kept subtle", "mh": true, "mc": true, "mhc": "Looks real, but as mentioned before, feels a bit closer than the reference scene.", "mcc": "A 50-degree vertical FOV with standard ACES Filmic tone mapping and no heavy post-processing provides a natural photographic lens feel.", "rh": true, "rc": true, "rhc": "Field of view solved from the photo. Bloom, chromatic aberration, vignette and grain are kept light.", "rcc": "The camera uses a photo-matched perspective field of view with restrained bloom, subtle edge chromatic aberration, light vignette, and fine grain."}, {"n": "29", "d": "Realism", "c": "A paused frame of the default view could pass for the reference photo at first glance", "mh": false, "mc": false, "mhc": "A paused frame reads as a stylised illustration, not as the photo.", "mcc": "Visible UI overlays, unshadowed low-poly cone trees, knife-edge shorelines without rocks, and smooth procedural shading fall short of passing for a real photograph.", "rh": true, "rc": true, "rhc": "At first glance the sky, the reflection and the peaks read as the photo. The lower left cliff still looks a bit CG on a closer look.", "rcc": "The combination of Cycles-baked 3D mountain geometry, scanned foreground rock and 3D rubble props, varied conifer forest, and planar water reflections closely matches the reference photo at first glance."}]}, {"id": "bamboo", "name": "Bamboo Grove", "rows": [{"n": "G1", "d": "Builds", "c": "The HTML opens in Chrome and the scene renders, with no errors or blank screen", "mh": true, "mc": true, "mhc": "Opens and renders with no errors. Needs internet for three.js from jsDelivr.", "mcc": "All Three.js imports, procedural textures, geometries, and post-processing passes are valid and error-free.", "rh": true, "rc": true, "rhc": "Opens in Chrome by double click and renders the grove with no errors.", "rcc": "The HTML loads the bundled asset scripts and initializes a complete WebGL Three.js scene that fades in once textures and meshes decode."}, {"n": "G2", "d": "Orbit", "c": "Dragging orbits the camera around the scene; the camera can't go below the ground or outside the scene", "mh": false, "mc": false, "mhc": "Camera can go below the ground, and it can rise above the canopy.", "mcc": "OrbitControls allows maxPolarAngle up to Math.PI with target at y=15.2 and maxDistance=35, letting the camera easily clip below the ground plane.", "rh": true, "rc": false, "rhc": "Drag orbits the camera inside fixed limits. It never goes below the ground or out of the grove.", "rcc": "In the render loop, `we.position.copy(ti)` resets the camera to a fixed point every frame, converting OrbitControls dragging into stationary look-around rotation with zero 3D parallax rather than orbiting around the scene."}, {"n": "G3", "d": "Builds", "c": "The scene runs at 30 fps or more on a standard laptop", "mh": true, "mc": true, "mhc": "Runs at 60 fps, checked with Chrome DevTools.", "mcc": "Instanced meshes keep draw calls very low (~20 draw calls total), easily running above 30 fps on a standard laptop.", "rh": true, "rc": true, "rhc": "Runs at 60 fps, checked with Chrome DevTools.", "rcc": "Rendering a single sky sphere, one quantized near-culm mesh, 28 instanced leaf quads, and a lightweight post-process pass will easily exceed 30 fps."}, {"n": "1", "d": "Prompt Adherence", "c": "There is no UI, text or interaction other than orbiting", "mh": false, "mc": false, "mhc": "A panel sits over the scene.", "mcc": "The page renders a full HUD panel with title text, camera preset buttons, sliders, and a Hide UI button.", "rh": true, "rc": true, "rhc": "No UI, text or buttons. Orbit is the only input.", "rcc": "There are no HTML UI elements, overlays, or interactions beyond pointer camera control (though `cursor: none` hides the mouse cursor)."}, {"n": "2", "d": "Prompt Adherence", "c": "At least one environmental motion runs on load, without any input", "mh": true, "mc": true, "mhc": "Stalk sway, canopy sway and floating motes run from load with no input.", "mcc": "Hero stalk wind sway, canopy rotation, and drifting dust motes run automatically on load.", "rh": true, "rc": true, "rhc": "Culms sway, the canopy rustles and leaves fall from the first frame, with no input.", "rcc": "Vertex-based bamboo wind sway, canopy UV displacement, cloud brightness drift, and 28 falling leaves run automatically on load."}, {"n": "3", "d": "Composition", "c": "The default view matches the photo's camera angle and framing", "mh": true, "mc": true, "mhc": "Low upward angle with the overhanging branch top left and the sky opening, as in the photo.", "mcc": "The default camera looks steeply upward (FOV 78, pos y=1.25 to target y=15.2, z=-9.2) with hero stalks, right-edge stalks, and upper-left tree matching the photo's framing.", "rh": true, "rc": true, "rhc": "Same low upward angle and framing as the photo, with the tree in the top left corner.", "rcc": "The default camera orientation (`camF`, `camU`, `insetUV`) is calibrated directly to the low-angle upward framing of the reference photo."}, {"n": "4", "d": "Reference Fidelity", "c": "Bamboo density matches the photo (similar spacing between stalks)", "mh": true, "mc": true, "mhc": "Stalk spacing and density are close to the photo.", "mcc": "Eleven foreground hero stalks and 460 instanced culms within a 30m radius recreate the dense bamboo spacing of the photo.", "rh": true, "rc": true, "rhc": "Culm spacing and density match the photo.", "rcc": "The Cycles-baked 360 panorama (`panoB`), perspective inset (`insetA`/`insetB`), and exported `near` culm geometry reproduce the stalk spacing of the reference."}, {"n": "5", "d": "Reference Fidelity", "c": "The colour palette matches the photo (yellow-green to deep green)", "mh": false, "mc": true, "mhc": "A thick white haze turns the palette pale grey green. The photo's saturated yellow green and deep green are missing.", "mcc": "Procedural textures and HSL instance colors reproduce sage/blue-green culms, lime-yellow sunlit upper foliage, and deep green shadows.", "rh": true, "rc": true, "rhc": "Yellow green canopy and dark green culms, within the photo range.", "rcc": "Extensive shader color grading (`leafGamma`, lime/teal shadow shifts, saturation curves) explicitly matches the yellow-green canopy and deep blue-green stalk palette of the photo."}, {"n": "6", "d": "Reference Fidelity", "c": "Ground elements in the photo (path, brushwood fence) are present", "mh": false, "mc": true, "mhc": "No path and no brushwood fence.", "mcc": "The reference photo looks steeply up into the canopy and contains no path or brushwood fence, which the scene accurately matches.", "rh": true, "rc": true, "rhc": "Dragging down shows the dirt path and the brushwood fence of dry bamboo.", "rcc": "The reference photo looks straight up into the canopy with no ground visible, and the full 360 Cycles render (`panoB`) includes ground and fence (`chão, cerca`) when looking down."}, {"n": "7", "d": "Reference Fidelity", "c": "The light matches the photo (sun or overcast, light direction)", "mh": true, "mc": true, "mhc": "Bright diffuse light from above, as in the photo, though the haze washes it out.", "mcc": "Bright overhead directional sunlight from the upper-left sky clearing and luminous sky dome match the photo's bright canopy lighting.", "rh": true, "rc": true, "rhc": "Soft bright overcast light from above, like the photo.", "rcc": "The Cycles-rendered textures and sky highlight grading reproduce the bright overcast sky filtering down from directly above."}, {"n": "8", "d": "Scene Fidelity", "c": "Stalks show nodes (rings) at regular intervals", "mh": true, "mc": true, "mhc": "Node rings are modelled as raised ridges at regular intervals.", "mcc": "Bamboo culm geometry builds 3D physical nodal ridges synced 1:1 with dark sheath scars and pale powdery rings in the texture.", "rh": true, "rc": true, "rhc": "Node rings at regular intervals on every culm.", "rcc": "Both the baked Cycles renders and near-culm geometry/textures depict regular bamboo node rings (`anel` / `entre os nós`)."}, {"n": "9", "d": "Scene Fidelity", "c": "Stalk thickness and height vary", "mh": true, "mc": true, "mhc": "Stalk thickness and height vary.", "mcc": "Hero and instanced stalks vary significantly in base radius/thickness scale (0.55–1.28) and height scale (0.75–1.22).", "rh": true, "rc": true, "rhc": "Culm thickness and height vary.", "rcc": "Each stalk in `near` has its own height (`H`) and thickness, ranging from thick foreground hero culms to thin background stalks."}, {"n": "10", "d": "Scene Fidelity", "c": "Stalks lean at slightly varied angles, not a perfect vertical grid", "mh": true, "mc": true, "mhc": "Stalks lean at slightly varied angles.", "mcc": "Stalks are placed radially with random lean angles on X and Z plus organic quadratic curvature.", "rh": true, "rc": true, "rhc": "Culms lean at slightly different angles, not a perfect grid.", "rcc": "The 3D culms (`uNB` base to `uNT` top vectors) lean at natural varied angles converging toward the canopy."}, {"n": "11", "d": "Scene Fidelity", "c": "The canopy is made of thin, narrow leaves in clusters", "mh": true, "mc": true, "mhc": "The canopy is made of narrow lance shaped leaves in clusters.", "mcc": "Canopy sprites procedurally draw branching twigs with clusters of thin lanceolate bamboo leaves.", "rh": true, "rc": false, "rhc": "The canopy is built from small fans of thin, narrow bamboo leaves along the branches.", "rcc": "The canopy is not 3D geometry made of thin leaves in clusters; it is a flat 2D equirectangular texture (`panoB`/`insetB`) mapped onto a 400m sphere."}, {"n": "12", "d": "Scene Fidelity", "c": "The ground is covered with soil and fallen leaves, not a flat plane", "mh": false, "mc": false, "mhc": "The ground is an uneven surface with a soil and fallen leaf texture, but it looks like a single block, and not different leaves.", "mcc": "The ground is only an undulating PlaneGeometry with a flat 2D canvas texture rather than 3D fallen leaves or detailed ground cover.", "rh": true, "rc": false, "rhc": "The ground is uneven soil covered with dry bamboo leaves and small pebbles.", "rcc": "There is no 3D ground geometry covered with soil and fallen leaves—everything except the near culm shafts and 28 falling quads is painted onto a 400m panorama sphere."}, {"n": "13", "d": "Scene Fidelity", "c": "When orbited, the grove continues in every direction with no visible edge", "mh": true, "mc": false, "mhc": "The grove and fog continue in every direction within the orbit range.", "mcc": "The grove stops at ~30m radius and the floor plane ends at 55m, leaving visible edges through the 0.017 fog when orbited to maxDistance=35.", "rh": true, "rc": true, "rhc": "The grove continues in every direction the orbit allows, with no visible edge.", "rcc": "Because the camera is locked at the center of a seamless 360-degree equirectangular render (`panoB`), the grove surrounds the viewer in all directions with no visible edge."}, {"n": "14", "d": "Lighting", "c": "Sunlight filtering through the canopy makes dappled patches on stalks and ground", "mh": false, "mc": false, "mhc": "Leaves cast no shadows, so there is no dappled light on the stalks or the ground.", "mcc": "The canopy leaf InstancedMesh has castShadow left at false, so leaves cast no dappled sunlight shadows onto stalks or the ground.", "rh": true, "rc": true, "rhc": "Soft warm sun patches filtered by the canopy fall on the thin culms and the ground.", "rcc": "The Cycles raytraced textures (`panoA`, `panoB`) bake realistic filtered canopy light onto the stalks and surroundings."}, {"n": "15", "d": "Lighting", "c": "Soft light shafts or haze give depth between the stalks", "mh": true, "mc": true, "mhc": "Fog and soft light cones give depth between the stalks.", "mcc": "Exponential fog and three additive Fresnel cone light shafts create soft depth and haze between the stalks.", "rh": true, "rc": false, "rhc": "Distance haze between the culms gives depth.", "rcc": "There are no volumetric light shafts, haze meshes, or depth fog shaders between the stalks."}, {"n": "16", "d": "Lighting", "c": "Backlit leaves glow, with light passing through them", "mh": true, "mc": true, "mhc": "Upper leaves glow with a light emissive tint.", "mcc": "Leaves use warm green emissive glow, height-based bright lime-yellow tinting, and UnrealBloomPass against the bright zenith.", "rh": true, "rc": true, "rhc": "Leaves at the sky openings glow with backlight.", "rcc": "The Cycles render and local contrast/lime-translucency shader (`leafGamma`, `uPLS`) produce glowing backlit foliage against the bright sky gaps."}, {"n": "17", "d": "Lighting", "c": "Shadows between stalks are dark but never fully black", "mh": true, "mc": true, "mhc": "No area between the stalks is fully black.", "mcc": "Hemisphere fill light (intensity 1.45) and a secondary rim directional light keep shadowed areas rich dark green rather than pure black.", "rh": true, "rc": true, "rhc": "Shadows between culms are dark green, never pure black.", "rcc": "Shader shadow-toe adjustments (`uToe`, `yl * 0.45`, teal shadow tinting) ensure dark areas between stalks stay rich and never clip to pure black."}, {"n": "18", "d": "Materials", "c": "Stalks show a waxy sheen and natural colour variation (yellowing, stains)", "mh": true, "mc": false, "mhc": "The culm texture has a waxy sheen, pale bloom and flecks, and stalk colours vary.", "mcc": "While bamboo has a roughness map, base roughness is 0.85 (matte) and every internode repeats the exact same weathering flecks with no yellowing.", "rh": true, "rc": true, "rhc": "Soft waxy sheen with natural stains, yellowing and lichen near the base.", "rcc": "The near-culm shader combines Cycles shading with 3D procedural mottling (`mot`), whitish-grey lichen (`lq`), and dark spots (`sp`) weighted toward the base."}, {"n": "19", "d": "Materials", "c": "Leaves are translucent", "mh": true, "mc": false, "mhc": "Leaves read as lit through, using an emissive tint rather than real translucency.", "mcc": "Leaf material is opaque MeshStandardMaterial with alphaTest and a uniform constant emissive color rather than light-dependent translucency or transmission.", "rh": true, "rc": false, "rhc": "Leaves read as translucent against the sky.", "rcc": "Canopy leaves are opaque pixels on a background sphere texture rather than translucent 3D leaf materials, and the 28 falling leaf quads use simple alpha blending without light transmission."}, {"n": "20", "d": "Materials", "c": "Ground materials read as real soil, leaves or stone", "mh": true, "mc": false, "mhc": "The ground reads as damp soil with fallen leaves.", "mcc": "Ground material lacks normal, bump, or roughness maps, reading as a flat painted ellipse pattern when viewed upon orbiting.", "rh": true, "rc": false, "rhc": "Ground is soil, leaf litter and pebbles.", "rcc": "There are no 3D ground meshes or PBR soil/leaf/stone materials in the scene, only a distant spherical panorama image."}, {"n": "21", "d": "Composition", "c": "Verticals are straight and level (no unintended tilt)", "mh": true, "mc": true, "mhc": "No unwanted roll. Verticals converge as in the upward photo.", "mcc": "Camera up-vector is standard Y-up with no roll, keeping perspective convergence clean and level.", "rh": true, "rc": true, "rhc": "No unwanted roll. Convergence matches the upward view of the photo.", "rcc": "The camera up-vector and upward pitch match the intentional steep upward convergence of the reference photograph without unintended roll."}, {"n": "22", "d": "Motion", "c": "The canopy sways in the wind", "mh": true, "mc": false, "mhc": "The canopy sways, though as one rigid block.", "mcc": "Canopy motion rigidly rotates the entire 60m-wide leafInstanced mesh as a single block around world origin instead of organic wind sway.", "rh": true, "rc": true, "rhc": "The canopy sways in the wind.", "rcc": "Upper canopy regions in the background shader sway in sync with nearby swaying stalks via `windField` directional UV warping."}, {"n": "23", "d": "Motion", "c": "Stalks bend more at the top than at the base", "mh": false, "mc": false, "mhc": "Stalks rotate rigidly from the base. They don't bend more at the top.", "mcc": "Hero stalks only animate via rigid-body rotation at the base with no vertex bending, and the 460 instanced stalks do not move at all.", "rh": true, "rc": true, "rhc": "Sway grows with height, so culms bend more at the top.", "rcc": "Stalk vertex displacement scales by `h * sqrt(h)` (`h^1.5` of normalized height `aH`), keeping bases anchored while bending tops."}, {"n": "24", "d": "Motion", "c": "Wind comes in varied gusts, not one uniform loop", "mh": false, "mc": false, "mhc": "The wind moves in a steady, regular loop, with no gusts.", "mcc": "Canopy, tree, and particle motions use single-frequency sine/cosine waves rather than varied wind gusts.", "rh": true, "rc": true, "rhc": "Wind comes in slow irregular gusts, not a steady motion.", "rcc": "The `gust(t)` function uses low-frequency 3D value noise (`vnoise`) combined with multi-sine `windField` and per-culm `windOwn` offsets for irregular gusts."}, {"n": "25", "d": "Motion", "c": "Falling leaves or dust particles drift through the light", "mh": true, "mc": true, "mhc": "Dust motes drift up through the light.", "mcc": "320 additive-blended pollen/dust particles drift gently through the sunlit forest air.", "rh": true, "rc": true, "rhc": "Falling leaves and dust drift through the light.", "rcc": "`Lm(28)` spawns 28 instanced bamboo-leaf quads that slowly flutter and drift downward around the camera."}, {"n": "26", "d": "Motion", "c": "Motion runs at real-world speed and loops without visible jumps", "mh": true, "mc": true, "mhc": "Motion runs on a continuous clock. Motes wrap back to the ground at the top of the canopy, mostly hidden by the haze.", "mcc": "Animations use continuous elapsed-time trigonometric functions at gentle real-world speeds with no loop resets.", "rh": true, "rc": true, "rhc": "Real speed motion on a continuous clock, with no visible jumps.", "rcc": "Wind frequencies and leaf fall speeds (`0.35..0.70 m/s` with smooth fade-in/out) run continuously in `uTime` at natural speeds without loop jumps."}, {"n": "27", "d": "Realism", "c": "No visibly cloned stalks (same curve or stain repeated nearby)", "mh": false, "mc": false, "mhc": "No, identical stalks stand side by side.", "mcc": "All 460 instanced stalks share one bent geometry and every single internode on every stalk tiles the exact same procedural stain texture.", "rh": true, "rc": true, "rhc": "No visible clones, every stalk looks different from the others.", "rcc": "Each culm has unique geometry in `near` and world-space 3D noise (`vRest`) for stains and lichen, preventing cloned patterns."}, {"n": "28", "d": "Realism", "c": "No pop-in or flicker when orbiting", "mh": true, "mc": true, "mhc": "No popping seen in the orbit captures.", "mcc": "Alpha-tested foliage, depth-write-disabled additive effects, and static geometry avoid pop-in or sorting flicker while orbiting.", "rh": true, "rc": false, "rhc": "Orbit sweep to every limit shows no popping or flicker.", "rcc": "Looking outside the default view transitions out of the high-res perspective inset (`uInset`) and exposes stretched 2D panorama pixels where swaying 3D culms detach from their baked background masks."}, {"n": "29", "d": "Realism", "c": "Leaves don't clip through stalks", "mh": false, "mc": false, "mhc": "If you zoom in, you can see they're clipping a bit between themselves and stalks.", "mcc": "Large 2.6m–4.8m intersecting leaf planes are scattered randomly around stalks without collision avoidance, causing frequent stalk clipping.", "rh": true, "rc": true, "rhc": "Leaves do not clip through the culms.", "rcc": "An occlusion mask (`tO`/`tIO`) discards near-culm fragments behind foreground foliage so swaying stalks pass cleanly behind leaves."}, {"n": "30", "d": "Realism", "c": "A paused frame of the default view could pass for the reference photo at first glance", "mh": false, "mc": false, "mhc": "Too hazy and too pale to pass for the photo at a glance.", "mcc": "Visible UI overlays, flat intersecting leaf cards, unshadowed foliage, and repetitive internode textures prevent passing for a real photograph.", "rh": true, "rc": true, "rhc": "Seen on its own, the paused default view reads as a photograph same framing, real culm texture and nodes, soft overcast light and natural depth. The canopy is slightly darker than in the reference.", "rcc": "With high-resolution Cycles path-traced insets (`5200x3489`), occlusion masking, chromatic aberration, film grain, and region-matched color curves, the default view closely resembles the photograph."}]}, {"id": "lighthouse", "name": "Snowy Lighthouse", "rows": [{"n": "G1", "d": "Builds", "c": "The HTML opens in Chrome and the scene renders, with no errors or blank screen", "mh": true, "mc": true, "mhc": "Opens and renders with no errors, behind a short loading screen.", "mcc": "The HTML and Three.js module code are valid, self-contained, and free of syntax or shader errors.", "rh": true, "rc": true, "rhc": "Opens straight from index.html in Chrome with no server.", "rcc": "The HTML and bundled Three.js code with preloaded base64 JS assets initialize and render cleanly without runtime errors."}, {"n": "G2", "d": "Orbit", "c": "Dragging orbits the camera around the scene; the camera can't go below the ground or outside the scene", "mh": true, "mc": false, "mhc": "Yes, you can orbit around the lighthouse. The polar limit keeps the camera above the ground", "mcc": "OrbitControls only restricts maxPolarAngle relative to the target, allowing the camera to clip through the elevated rocky terrain (up to y=7m) or pan underground.", "rh": true, "rc": true, "rhc": "Orbit is limited in distance and angle. The camera stays above the terrain, so it can’t go under the rock or leave the scene.", "rcc": "OrbitControls are active with ground heightmap collision and distance clamping keeping the camera above terrain and inside the scene."}, {"n": "G3", "d": "Builds", "c": "The scene runs at 30 fps or more on a standard laptop", "mh": true, "mc": true, "mhc": "Runs at 60 fps, checked with Chrome DevTools.", "mcc": "Geometry counts, instancing, and procedural shaders are lightweight enough to maintain 30+ fps on a standard laptop.", "rh": true, "rc": true, "rhc": "Runs at 60 fps, checked with Chrome DevTools.", "rcc": "Baked lighting, unlit projection shaders, a radial water mesh, and lightweight point systems easily sustain over 30 fps."}, {"n": "1", "d": "Prompt Adherence", "c": "There is no UI, text or interaction other than orbiting", "mh": false, "mc": false, "mhc": "A panel with camera, lighting and toggle buttons, a title and a hint sit over the scene.", "mcc": "The page includes a full HUD control panel with buttons, text, and checkboxes, violating the no-UI and orbit-only requirement.", "rh": true, "rc": true, "rhc": "No UI, no text and no buttons. Orbit is the only interaction.", "rcc": "The HTML body contains only the WebGL canvas with no UI overlays, text, or non-camera interactions."}, {"n": "2", "d": "Prompt Adherence", "c": "At least one environmental motion runs on load, without any input", "mh": true, "mc": true, "mhc": "Waves roll, the surf foam moves and the clouds drift from load, with no input.", "mcc": "Ocean waves and subtle horizon cloud drift animate automatically on load.", "rh": true, "rc": true, "rhc": "The sea, shore foam, wave spray, drifting snow and wind in the grass all start on load with no input.", "rcc": "Waves, surf foam, spray particles, drifting snow, and horizon cloud wisps animate automatically on load."}, {"n": "3", "d": "Composition", "c": "The default view matches the photo's camera angle and framing", "mh": true, "mc": true, "mhc": "Eye level with the lighthouse right of centre and the sea behind, as in the photo, though the tower is larger in frame.", "mcc": "The default camera position, 38-degree FOV, and target closely match the framing and perspective of the reference photo.", "rh": true, "rc": true, "rhc": "The camera is locked to the photo, the same corner on view of the tower and the same horizon height.", "rcc": "The camera opens at the calibrated viewpoint and FOV matching the reference photograph's framing and projective render."}, {"n": "4", "d": "Reference Fidelity", "c": "The lighthouse matches the photo's shape and colours (tower, lantern, trim)", "mh": true, "mc": true, "mhc": "White octagonal tower with a red lantern and cap and a white gallery rail, as in the photo.", "mcc": "The lighthouse accurately recreates the white octagonal tower, entrance porch, red lantern room, and red conical roof.", "rh": true, "rc": true, "rhc": "White octagonal tower with a red lantern and red cap, white gallery, door, black plaque and small windows, as in the photo.", "rcc": "The 3D lighthouse model uses Cycles-baked and camera-projected textures matching the white tower and red octagonal lantern."}, {"n": "5", "d": "Reference Fidelity", "c": "The lighthouse sits on a rocky shore with snow on the rocks, as in the photo", "mh": false, "mc": true, "mhc": "The headland is a smooth snow dome with snow-covered boulders. The photo's exposed grey granite is almost entirely missing.", "mcc": "The lighthouse sits atop a granite headland with procedural snow drifts, exposed rock crests, and the curved melted path.", "rh": true, "rc": true, "rhc": "The tower stands on rounded granite outcrops with snow lying in patches and in the hollows, plus scattered boulders and snowy stone steps.", "rcc": "The lighthouse sits atop a sculpted granite shore mesh covered in snow patches matching the photo."}, {"n": "6", "d": "Reference Fidelity", "c": "The ocean is visible beyond the rocks, as in the photo", "mh": true, "mc": true, "mhc": "The ocean is visible beyond the headland.", "mcc": "The Atlantic ocean and distant coastline hills are clearly visible on both sides beyond the rocky shore.", "rh": true, "rc": true, "rhc": "Deep blue ocean all along the horizon behind the rocks, with the far shoreline on the right, as in the photo.", "rcc": "The ocean mesh extends out to 7 km around the rocky headland and is clearly visible on both sides beyond the rocks."}, {"n": "7", "d": "Reference Fidelity", "c": "The clear blue winter sky and light match the photo", "mh": true, "mc": true, "mhc": "Clear blue winter sky with bright, low sunlight.", "mcc": "The procedural winter sky dome and crisp directional sunlight from the front-left match the clear blue sky and lighting of the photo.", "rh": true, "rc": true, "rhc": "Clear blue sky that gets paler toward the horizon, with low bright winter sun from the left.", "rcc": "The sky dome shader uses row-by-row color stops sampled from the photo with subtle brightening toward the sun on the left."}, {"n": "8", "d": "Scene Fidelity", "c": "The tower's shape and proportions match the photo", "mh": false, "mc": true, "mhc": "Doesn't look octagonal, and more rounded.", "mcc": "The tapered octagonal shaft, flared gallery corbel, porch vestibule, and lantern proportions closely match Peggy's Cove lighthouse.", "rh": true, "rc": true, "rhc": "Tapered octagonal tower with the same height to width ratio and the lantern on top, matched against the photo.", "rcc": "The scene GLB and camera-projected depth/texture maps reproduce Peggy's Cove lighthouse's tapered octagonal proportions."}, {"n": "9", "d": "Scene Fidelity", "c": "The lantern room has windows and a railing gallery", "mh": true, "mc": true, "mhc": "The lantern has glass panes with red mullions and a railing gallery.", "mcc": "The lantern room features transparent glass panels with red mullions surrounded by an octagonal post-and-rail gallery.", "rh": true, "rc": true, "rhc": "The lantern has glazed panels with mullions and a gallery with a railing around it.", "rcc": "The lighthouse GLB combined with a dedicated physical transmissive octagonal glass cylinder provides windows and gallery detail."}, {"n": "10", "d": "Scene Fidelity", "c": "Rocks show natural shapes with cracks and fissures, not smooth blobs", "mh": false, "mc": true, "mhc": "The boulders are smooth low-poly blobs with no cracks or fissures.", "mcc": "Terrain and boulders combine multi-octave FBM, ridged crack grooves, normal maps, and dark fissure shading rather than smooth blobs.", "rh": true, "rc": true, "rhc": "Rounded granite lobes with crevices, plus rock that adds cracks, pits and grain.", "rcc": "The terrain and boulder meshes feature sculpted fissures, baked renders, and triplanar scanned granite grain detail."}, {"n": "11", "d": "Scene Fidelity", "c": "The lighthouse base sits flush on the rock (no floating or sinking)", "mh": true, "mc": true, "mhc": "The tower sits flush on its plinth on the rock.", "mcc": "The lighthouse plinth is embedded slightly into the computed terrain height so it sits flush without floating.", "rh": true, "rc": true, "rhc": "The base sits on a white apron set into the rock. Nothing floats and nothing is buried.", "rcc": "The lighthouse and terrain come from a unified calibrated scene GLB with depth-tested multi-view projections sitting flush on the rock."}, {"n": "12", "d": "Scene Fidelity", "c": "When orbited, the ocean reaches the horizon with no visible edge", "mh": true, "mc": true, "mhc": "The ocean reaches the horizon in every direction, with no visible edge.", "mcc": "The 1600x1600 ocean plane fades seamlessly into the sky horizon color via distance haze well before its edges.", "rh": true, "rc": false, "rhc": "The sea and the far shore wrap around the whole orbit range, and no sea edge shows at any allowed angle.", "rcc": "The ocean disc only reaches a radius of 7,000 m while the sky dome is at 20,000 m, leaving a visible gap and outer edge before the geometric horizon when orbited."}, {"n": "13", "d": "Lighting", "c": "Shadows of the tower and rocks all match one sun direction", "mh": true, "mc": true, "mhc": "One sun, and every shadow falls the same way.", "mcc": "A single shadow-casting directional sunLight drives consistent shadows across the tower, terrain, and boulders.", "rh": true, "rc": true, "rhc": "All lighting comes from one baked sun, so the shadows of the tower, boulders, steps and handrail fall the same way.", "rcc": "All Cycles lightmap bakes, multi-view projections, and the directional light share a consistent sun direction."}, {"n": "14", "d": "Lighting", "c": "The white tower shows shading on its shadow side and is not blown out", "mh": true, "mc": true, "mhc": "The tower is not blown out and shows a soft shaded side, though the shading is subtle.", "mcc": "ACES Filmic tone mapping, balanced sun intensity, and cool hemisphere/fill lights give the white tower clear shading on its right shadow side without blowing out.", "rh": true, "rc": true, "rhc": "The tower’s shaded faces read cool grey and the sunlit faces stay below pure white.", "rcc": "The Cycles-baked and projected textures on the lighthouse preserve crisp shading on the shadow side without clipping to pure white."}, {"n": "15", "d": "Lighting", "c": "The horizon fades into haze", "mh": true, "mc": true, "mhc": "The sea fades into a pale haze at the horizon.", "mcc": "Both scene exponential fog and custom shader distance fog blend distant geometry and water smoothly into horizon haze.", "rh": true, "rc": true, "rhc": "The sea and the far shore lose contrast and turn pale blue toward the horizon.", "rcc": "Both the sky dome gradient and the ocean shader's distance haze blend smoothly toward a muted horizon tone."}, {"n": "16", "d": "Lighting", "c": "No area of the default view is fully black or blown out to white", "mh": true, "mc": true, "mhc": "Nothing in the default view is fully black or blown out.", "mcc": "Hemisphere and bounce fill lighting prevent crushed blacks while ACES tone mapping prevents clipped whites.", "rh": true, "rc": true, "rhc": "The darkest wet rock at the waterline is lifted to a dark grey, and the snow highlights stay below clipping.", "rcc": "Shadow luminance floors in the terrain shader and calibrated Cycles renders prevent pure black crushes or blown-out white regions."}, {"n": "17", "d": "Materials", "c": "The paint shows subtle weathering, not clean plastic", "mh": false, "mc": false, "mhc": "Clean flat white paint with only a fine bump. No grime, streaks or wear.", "mcc": "The tower and lantern use uniform base colors with only a subtle concrete bump map and no paint weathering, dirt, or wear variation.", "rh": true, "rc": true, "rhc": "The paint has faint plaster variation and light grime streaks under the top edges, so it doesn’t read as clean plastic.", "rcc": "High-resolution baked and projected Cycles renders give the tower realistic painted masonry shading rather than flat plastic."}, {"n": "18", "d": "Materials", "c": "Snow reads as snow (bright and soft, not grey plastic); exposed rock reads as real stone, darker and wet near the waterline", "mh": false, "mc": true, "mhc": "Snow reads as snow, but there is almost no exposed rock, and none of it is dark and wet at the waterline.", "mcc": "Snow appears bright with subtle sparkles, while exposed rock has multi-scale granite speckles and darkens with low roughness near the waterline.", "rh": true, "rc": true, "rhc": "Snow is bright and soft with a crystal grain. Exposed granite is grainy and cracked, and it gets darker and wet looking near the waterline.", "rcc": "Snow retains soft bright shading while bare rock receives triplanar granite grain and dynamic darkening in the wet surf zone."}, {"n": "19", "d": "Materials", "c": "The lantern glass reflects and is see-through", "mh": true, "mc": true, "mhc": "The lantern glass is see-through and reflects an environment map of the sky.", "mcc": "The lantern glazing uses MeshPhysicalMaterial with transmission, opacity, high reflectivity, and an IBL environment map, revealing the lens inside.", "rh": true, "rc": true, "rhc": "The lantern glass uses real transmission, so the lens shows through and the sky reflects in the panes.", "rcc": "An explicit octagonal MeshPhysicalMaterial cylinder with 0.92 transmission, 1.5 IOR, and PMREM environment reflections models the lantern glass."}, {"n": "20", "d": "Materials", "c": "The sea reflects more sky at grazing angles and shifts colour with depth", "mh": false, "mc": true, "mhc": "The sea reflects more sky at grazing angles, but its colour shifts with wave height, not depth.", "mcc": "The ocean shader computes Fresnel sky reflections at grazing angles and blends between deep and shallow blue tones.", "rh": true, "rc": true, "rhc": "Fresnel gives more sky reflection at grazing angles, and the water shifts from deep navy offshore to a lighter tone in the shallows.", "rcc": "The custom water shader computes Schlick Fresnel sky reflections and blends between deep navy and greener shallow water colors."}, {"n": "21", "d": "Composition", "c": "The horizon is level", "mh": true, "mc": true, "mhc": "The horizon is level.", "mcc": "The camera has zero roll and the ocean and sky horizon sit level.", "rh": true, "rc": true, "rhc": "The horizon is level across the frame.", "rcc": "The camera up-vector is vertical and the sky/ocean horizon is explicitly leveled."}, {"n": "22", "d": "Motion", "c": "Waves roll in continuously, with varied heights", "mh": true, "mc": true, "mhc": "The swell rolls in continuously, with waves of different heights.", "mcc": "Overlapping sine vertex waves and multi-octave animated noise create continuous rolling swells of varied height.", "rh": true, "rc": true, "rhc": "Several layered wave trains with different lengths and speeds keep the swell coming in with varied heights.", "rcc": "Four superimposed Gerstner swell components with differing wavelengths, directions, and amplitudes roll continuously."}, {"n": "23", "d": "Motion", "c": "Waves break on the rocks with foam and spray", "mh": false, "mc": false, "mhc": "A foam ring moves around the shore, but there is no breaking and no spray.", "mcc": "There is no wave-breaking spray on the rocks, and foam is only a generic elliptical shader ring rather than waves breaking against actual boulders.", "rh": true, "rc": true, "rhc": "Swell breaks on the rocks with a foam wash, and spray bursts at the shore points.", "rcc": "Shoreline Voronoi lace foam, rock-face surge run-up, and 1,300 ballistic spray particles break along the coastal rocks."}, {"n": "24", "d": "Motion", "c": "Foam spreads and fades gradually (doesn't pop in or out)", "mh": true, "mc": true, "mhc": "The foam band moves and fades smoothly, with no popping.", "mcc": "The procedural shoreline foam ring modulates smoothly with sine and smoothstep functions without popping.", "rh": true, "rc": true, "rhc": "The foam rises and thins with the surge and fades out over time. It never pops in or out.", "rcc": "Surf foam and spray use smoothstepped phase curves and quadratic alpha decay so white water spreads and dissipates gradually."}, {"n": "25", "d": "Motion", "c": "Wind shows in the scene (drifting snow, spray blown off the waves)", "mh": false, "mc": false, "mhc": "The snow flurries are off by default and there is no spray, so no wind shows on load.", "mcc": "Snow flurries are hidden on load, grass tufts are static, and there is no wind-blown sea spray visible by default.", "rh": true, "rc": true, "rhc": "Snow drifts low across the rock, spray is blown inland and the grass sways in the wind.", "rcc": "1,400 snow particles hop and drift across the heightmap in gusts while wave spray is pushed inland along +x by wind."}, {"n": "26", "d": "Motion", "c": "Motion runs at real-world speed and loops without visible jumps", "mh": true, "mc": true, "mhc": "Waves, foam and clouds run on a continuous clock with no visible jumps.", "mcc": "Continuous elapsed-time wave and cloud motion runs at a natural pace without looping jumps.", "rh": true, "rc": true, "rhc": "Everything moves at real world speed with no visible jump.", "rcc": "All wave, ripple, foam, cloud, and particle frequencies are integer multiples of a 48-second period for a seamless real-time loop."}, {"n": "27", "d": "Realism", "c": "No repeating tile pattern on the ocean toward the horizon", "mh": false, "mc": true, "mhc": "The waves follow a regular pattern that repeats toward the horizon.", "mcc": "The ocean uses non-periodic world-space multi-octave noise faded out with distance, avoiding visible tiling.", "rh": true, "rc": true, "rhc": "The water surface is well broken up, and no repeating pattern shows toward the horizon.", "rcc": "Dual-scale normal maps scroll at different scales and fade out via smoothstep before the horizon alongside procedural noise."}, {"n": "28", "d": "Realism", "c": "Spray particles are soft, not visible sprite squares", "mh": false, "mc": false, "mhc": "There are no spray particles in the scene.", "mcc": "There are no spray particles, and the optional snow PointsMaterial uses no alpha texture map so particles render as hard squares.", "rh": true, "rc": true, "rhc": "Spray and snow use soft round sprites with fading alpha, not hard squares.", "rcc": "Spray and snow particles sample a radial gradient canvas texture that fades smoothly to zero alpha at the edges."}, {"n": "29", "d": "Realism", "c": "Water meets the rocks with foam, not a hard clipping line", "mh": true, "mc": false, "mhc": "A foam band runs where the water meets the shore.", "mcc": "Water-foam placement uses a rough elliptical formula independent of actual terrain height or shore boulders, leaving a hard clipping line where water meets rock.", "rh": true, "rc": true, "rhc": "The water meets the rock through a soft foam rim that follows the swell, not a hard clip line.", "rcc": "A shoreline distance map drives animated foam wash on the water paired with matching surf run-up and wet darkening on the rocks."}, {"n": "30", "d": "Realism", "c": "A paused frame of the default view could pass for the reference photo at first glance", "mh": false, "mc": false, "mhc": "The smooth snow field and blob boulders make the paused frame read as CG, not as the photo.", "mcc": "Despite good composition, the visible UI overlay, procedural blob boulders, geometric cone grass, and clean uniform tower prevent it from passing as a live photograph.", "rh": true, "rc": true, "rhc": "Paused on the default view, the tower, rock, snow, sea and sky read as the photo at a first glance.", "rcc": "Multi-view Cycles projections, matched sky/water colorimetry, and detailed geometry closely reproduce the reference photograph at default view."}]}];

const CARBON = {
  scores: [
    ['Moraine Lake', '13 / 32', '24 / 32', '32 / 32', '30 / 32', '80%'],
    ['Bamboo Grove', '22 / 33', '19 / 33', '33 / 33', '26 / 33', '79%'],
    ['Snowy Lighthouse', '21 / 33', '25 / 33', '33 / 33', '32 / 33', '86%']
  ],
  cats: [
    ['Builds', 12, 12], ['Prompt Adherence', 12, 12], ['Composition', 11, 12], ['Lighting', 22, 24],
    ['Motion', 25, 28], ['Realism', 19, 24], ['Reference Fidelity', 20, 26], ['Scene Fidelity', 23, 30],
    ['Orbit', 4, 6], ['Materials', 12, 22]
  ]
};

function judgeTable(rows) {
  const order = [];
  rows.forEach(r => { if (!order.includes(r.d)) order.push(r.d); });
  const cm = (side, label, h, c, hc, cc) => {
    const out = [];
    if (hc) out.push(`<p class="cl"><span class="src">${label} · Human</span> ${esc(hc)}</p>`);
    if (h !== c && cc) out.push(`<p class="cl"><span class="src">${label} · Carbon</span> ${esc(cc)}</p>`);
    return out.join('');
  };
  const body = order.map(d => `<tr class="grp"><th colspan="6">${esc(d)}</th></tr>` + rows.filter(r => r.d === d).map(r => {
    const dis = r.mh !== r.mc || r.rh !== r.rc;
    return `<tr class="${dis ? 'dis' : 'agree'}"><td><strong>${esc(r.n)}</strong> &mdash; ${esc(r.c)}</td><td class="c">${mark(r.mh)}</td><td class="c">${mark(r.mc)}</td><td class="c">${mark(r.rh)}</td><td class="c">${mark(r.rc)}</td><td class="cm">${cm('m', 'Model', r.mh, r.mc, r.mhc, r.mcc)}${cm('r', 'Redesign', r.rh, r.rc, r.rhc, r.rcc)}</td></tr>`;
  }).join('')).join('');
  return `<div class="table-wrap"><table class="rubric merged judge"><thead><tr><th>Rubric</th><th>Model<br>Human</th><th>Model<br>Carbon</th><th>Redesign<br>Human</th><th>Redesign<br>Carbon</th><th>Comments</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function judgeSections() {
  return CARBON_RUBRICS.map(s => {
    const n = s.rows.length * 2;
    const a = s.rows.reduce((k, r) => k + (r.mh === r.mc) + (r.rh === r.rc), 0);
    return `<details class="sec"><summary><h2>${esc(s.name)}</h2><span class="label">${a} / ${n} agree</span></summary>${judgeTable(s.rows)}</details>`;
  }).join('');
}

function renderCarbon() {
  const scores = CARBON.scores.map(r => `<tr><td>${esc(r[0])}</td>${r.slice(1).map(v => `<td class="mono">${v}</td>`).join('')}</tr>`).join('');
  const cats = CARBON.cats.map(([c, a, n]) => `<tr><td>${esc(c)}</td><td class="mono">${a} / ${n}</td><td class="mono">${Math.round(100 * a / n)}%</td></tr>`).join('');
  page.className = 'doc wide';
  page.innerHTML = `
    <h1 class="home">Carbon as judge</h1>
    <p class="lead">We ran the same rubrics through Gemini 4 Carbon as a judge. Carbon read the code of each scene, without running it, and scored every criterion pass or fail for both Gemini's answer and the redesign. It agreed with the human review on 160 of 196 criteria (82%).</p>
    <h2>Scores</h2>
    <div class="table-wrap"><table class="rubric plain"><thead><tr><th>Sample</th><th>Model · Human</th><th>Model · Carbon</th><th>Redesign · Human</th><th>Redesign · Carbon</th><th>Agreement</th></tr></thead><tbody>${scores}</tbody></table></div>
    <h2>Agreement by category</h2>
    <div class="table-wrap"><table class="rubric plain"><thead><tr><th>Category</th><th>Agree</th><th>%</th></tr></thead><tbody>${cats}</tbody></table></div>
    <h2>Takeaways</h2>
    <ul>
      <li><strong>Reliable on what the code shows.</strong> Full agreement on builds and prompt adherence: it caught the extra UI in all three Gemini answers.</li>
      <li><strong>Too lenient on Gemini's answers.</strong> It trusts what the code intends, not how it looks. It passed 19 criteria the human review failed, 11 of them on Moraine Lake, and caught only 23 of 42 human fails.</li>
      <li><strong>Too strict on technique.</strong> It failed 17 criteria the human review passed, 7 of them on the Bamboo Grove redesign, which uses baked renders instead of 3D geometry. Materials is the weakest category, at 55%.</li>
    </ul>
    <h2>All rubrics</h2>
    <p class="note">Every criterion with the human and Carbon verdicts. Rows where they disagree are marked in red, with Carbon's reason next to the human comment.</p>
    <div class="legend label"><span><i style="background:rgba(248,113,113,.6)"></i>Disagreement</span></div>
    <label class="page-filter label"><input type="checkbox" id="only-dis"> Show disagreements only</label>
    <div id="judge">${judgeSections()}</div>`;
  const box = document.getElementById('only-dis'), judge = document.getElementById('judge');
  box.addEventListener('change', () => judge.classList.toggle('only-dis', box.checked));
}

function pane(label, src) {
  const body = src
    ? `<iframe data-src="${esc(src)}" title="${esc(label)}" allow="fullscreen" allowfullscreen></iframe><div class="loading" aria-live="polite"><span class="spin" aria-hidden="true"></span><span class="label">Loading</span></div>`
    : `<div class="pending">HTML pending</div>`;
  const open = src ? `<a href="${esc(src)}" target="_blank" rel="noopener">Open full screen</a>` : '';
  return `<figure class="pane"><div class="pane-head"><span class="label">${esc(label)}</span>${open}</div><div class="frame">${body}</div></figure>`;
}

function filesTable(list) {
  if (!list.length) return `<div class="pending" style="margin-top:12px">Final scene pending</div>`;
  const rows = list.map(f => `<tr><td class="mono" style="color:var(--ink)">${esc(f.name)}</td><td class="mono">${esc(f.size)}</td><td class="cm">${esc(f.type)}</td></tr>`).join('');
  return `<div class="table-wrap"><table class="rubric plain"><thead><tr><th>Asset</th><th>Size</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function sourcesTable(list) {
  const rows = list.map(a => `<tr><td>${esc(a.name)}</td><td class="src">${a.source ? `<a href="${esc(a.source)}" target="_blank" rel="noopener">${esc(host(a.source))}</a>` : na}</td><td class="cm">${esc(a.licence)}</td></tr>`).join('');
  return `<div class="table-wrap"><table class="rubric plain"><thead><tr><th>Source asset</th><th>Source</th><th>Licence</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rubricTable(rows) {
  const order = [];
  rows.forEach(r => { if (!order.includes(r.d)) order.push(r.d); });
  const body = order.map(d => `<tr class="grp"><th colspan="4">${esc(d)}</th></tr>` + rows.filter(r => r.d === d).map(r =>
    `<tr class="${r.n.startsWith('G') ? 'gate' : r.d === 'Realism' ? 'real' : ''}"><td><strong>${esc(r.n)}</strong> &mdash; ${esc(r.c)}</td><td class="c">${mark(r.m)}</td><td class="c">${mark(r.r)}</td><td class="cm">${r.mc ? `<p class="cl"><span class="src">Model</span> ${esc(r.mc)}</p>` : ''}${r.rc ? `<p class="cl"><span class="src">Redesign</span> ${esc(r.rc)}</p>` : ''}</td></tr>`).join('')).join('');
  return `<div class="legend label"><span><i style="background:rgba(63,140,232,.5)"></i>Gate</span><span><i style="background:rgba(232,190,63,.5)"></i>Realism check</span></div>
    <div class="table-wrap"><table class="rubric merged"><thead><tr><th>Rubric</th><th>Model version</th><th>Redesign</th><th>Comments</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderSample(s) {
  const total = s.files.reduce((a, f) => a + f.bytes, 0);
  page.className = 'doc wide';
  page.innerHTML = `
    <header class="title-row"><div><h1>${esc(s.name)}</h1><div class="label">${s.rubric.length} criteria &middot; ${s.round_count} review rounds</div></div></header>
    <div class="prompt"><img src="${esc(s.thumb)}" alt="Reference photo sent with the prompt"><div><div class="label">Prompt &middot; sent with the reference photo</div><p>${esc(PROMPT)}</p></div></div>
    <section id="compare"><div class="compare">${pane('Model version', s.model)}${pane('Redesign', s.redesign)}</div></section>
    <section>
      <h2>Reference vs render</h2>
      <div class="slider" id="cmp" style="--pos:50%">
        <img src="${esc(s.ref)}" alt="Reference photo">
        <div class="top"><img src="${esc(s.render)}" alt="3D render"></div>
        <div class="bar"></div><div class="knob">${ARROWS}</div>
        <span class="tag l label">Photo</span><span class="tag r label">${esc(s.render_label)}</span>
      </div>
    </section>
    <details class="sec"><summary><h2>Assets</h2><span class="label">${s.files.length} files &middot; ${(total / 1048576).toFixed(1)} MB</span></summary>
      ${filesTable(s.files)}
      <div class="label sub-h">Sources and licences</div>
      ${sourcesTable(s.sources)}
    </details>
    <details class="sec"><summary><h2>Rubrics</h2><span class="label">Model ${score(s.rubric, 'm')} &middot; Redesign ${score(s.rubric, 'r')} pass</span></summary>${rubricTable(s.rubric)}</details>`;
  // Set src only after the listener is in place, and ignore the about:blank load that comes before it.
  page.querySelectorAll('.frame iframe[data-src]').forEach(f => {
    let started = false;
    f.addEventListener('load', () => {
      if (!started) return;
      let href = '';
      try { href = f.contentWindow.location.href; } catch (e) { href = 'cross-origin'; }
      if (href === 'about:blank') return;
      f.nextElementSibling?.classList.add('done');
    });
    requestAnimationFrame(() => { started = true; f.src = f.dataset.src; });
  });
  wireSlider(document.getElementById('cmp'));
}

function render() {
  const id = location.hash.slice(1);
  const s = SAMPLES.find(x => x.id === id);
  document.querySelectorAll('.side a[data-id]').forEach(a => { if (a.dataset.id === (s ? s.id : id === 'carbon' ? 'carbon' : 'overview')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (s) renderSample(s); else if (id === 'carbon') renderCarbon(); else renderOverview();
  window.scrollTo(0, 0);
}

function wireSlider(el) {
  const set = x => { const r = el.getBoundingClientRect(); el.style.setProperty('--pos', Math.min(100, Math.max(0, (x - r.left) / r.width * 100)) + '%'); };
  let drag = false;
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); set(e.clientX); });
  el.addEventListener('pointermove', e => { if (drag) set(e.clientX); });
  el.addEventListener('pointerup', () => { drag = false; });
  el.tabIndex = 0;
  el.addEventListener('keydown', e => {
    const cur = parseFloat(el.style.getPropertyValue('--pos')) || 50;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); el.style.setProperty('--pos', Math.min(100, Math.max(0, cur + (e.key === 'ArrowRight' ? 5 : -5))) + '%'); }
  });
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
