"The body and neck are smooth sculpted shells with a fine bump, not layered plumage.", "j": false, "v": 0, "k": 5, "jc": "In Screenshots 1 to 4, the body, neck, and wings read as smooth plastic tubes and cones rather than soft, layered plumage.", "jo": ""}, {"n": "17", "d": "Materials", "c": "Legs read as matte skin with darker joints, and the beak tip as glossy black", "h": true, "hc": "The legs are matte with darker joints, and the beak tip is glossy black.", "j": false, "v": 0, "k": 5, "jc": "While the legs have darker joints in Screenshot 1, the entire neck and beak share a single plumageMat (roughness: 0.58 with featherBump), making the black beak tip matte rather than glossy.", "jo": ""}, {"n": "18", "d": "Materials", "c": "The water is a smooth, glossy surface that reflects more at grazing angles", "h": true, "hc": "The water is a smooth, glossy surface with a Fresnel reflection.", "j": true, "v": 5, "k": 5, "jc": "Comparing Screenshot 4 (from above) with Screenshots 1 and 5 (low grazing angles) shows a smooth water surface whose Fresnel reflection strengthens noticeably at grazing angles.", "jo": ""}, {"n": "19", "d": "Materials", "c": "The bird and its legs reflect in the water, as in the photo", "h": true, "hc": "The bird and its legs reflect in the water.", "j": true, "v": 5, "k": 5, "jc": "Screenshot 1 shows the pink legs reflecting in the water, and Screenshot 5 shows the full body and neck reflected on the water surface.", "jo": ""}, {"n": "20", "d": "Composition", "c": "The water surface is level, with no unintended tilt", "h": true, "hc": "The water is level.", "j": true, "v": 5, "k": 5, "jc": "Screenshots 1, 2, 3, and 5 show the water plane and horizon completely horizontal with no unintended tilt.", "jo": ""}, {"n": "21", "d": "Motion", "c": "Ripples spread out from the legs across the water and distort the reflection", "h": false, "hc": "One ring at the forward foot pulses in place. Ripples don't spread out from the legs.", "j": false, "v": 0, "k": 5, "jc": "In the code, footRipple is a single flat RingGeometry on one foot that only pulses its scale by 6% and does not spread outward or distort the Water shader's reflection.", "jo": ""}, {"n": "22", "d": "Motion", "c": "The bird shows subtle life: breathing, a small head or neck movement, or feathers stirring", "h": false, "hc": "The bird bobs by 8 mm and the neck turns by a fraction of a degree, too little to see.", "j": true, "v": 5, "k": 5, "jc": "In animate(), subtle sine-wave oscillations on flamingo.position.y and neckMesh.rotation.z provide gentle continuous breathing and neck motion.", "jo": ""}, {"n": "23", "d": "Motion", "c": "A light breeze moves small wavelets across the water or ruffles the feathers", "h": true, "hc": "A scrolling normal map moves small wavelets across the water.", "j": true, "v": 5, "k": 5, "jc": "In animate(), advancing water.material.uniforms['time'].value at 0.22x elapsed time moves small wavelets continuously across the water surface.", "jo": ""}, {"n": "24", "d": "Motion", "c": "Motion runs at real-world speed and loops without visible jumps", "h": true, "hc": "Motion runs on a continuous clock with no visible jumps.", "j": true, "v": 5, "k": 5, "jc": "All motions in animate() are driven by low-frequency sine waves and a wrapping normal map scrolling linearly with elapsed time, running at calm real-world speeds without jumps.", "jo": ""}, {"n": "25", "d": "Realism", "c": "Ripple rings are concentric and fade with distance, with no repeating tile pattern on the water", "h": false, "hc": "There is a single ring that keeps a hard edge, not concentric rings that fade with distance.", "j": false, "v": 0, "k": 5, "jc": "Screenshots 1, 2, 3, and 5 show visible repeating horizontal bands from the tiled water normal map, and footRipple is a single sharp-edged ring on one foot rather than concentric rings fading with distance.", "jo": ""}, {"n": "26", "d": "Realism", "c": "The legs do not clip through the body or the water surface", "h": true, "hc": "The legs don't cut through the body or the water in the captures.", "j": false, "v": 2, "k": 5, "jc": "In Screenshot 1, the upper leg tuft cones intersect directly into the bottom of the torso, and the left foot cone slices upward through the water surface.", "jo": "Screenshots 1–3 show the leg shafts and hip tufts attaching cleanly to the underside of the torso and entering the water plane without poking through the upper body."}, {"n": "27", "d": "Realism", "c": "The plumage shows no visible texture seams or repeats", "h": true, "hc": "No visible texture seams or repeats on the plumage.", "j": true, "v": 5, "k": 5, "jc": "Screenshots 1 to 4 show smooth vertex-color gradients and subtle procedural bump mapping across the bird with no visible UV seams or repeating texture patterns.", "jo": ""}, {"n": "28", "d": "Realism", "c": "The bird's outline is clean against the background, with no jagged cut-out edges or halos", "h": true, "hc": "The outline is clean geometry, with no cut-out edges or halos.", "j": true, "v": 5, "k": 5, "jc": "Screenshots 1 to 5 show clean, anti-aliased 3D geometry silhouettes against the sky and water with no jagged cut-out edges or halos.", "jo": ""}, {"n": "29", "d": "Realism", "c": "A paused frame of the default view could pass for the reference photo at first glance", "h": false, "hc": "The horizon, the smooth shell body and the simple legs make the paused frame read as CG, not as the photo.", "j": false, "v": 0, "k": 5, "jc": "Screenshot 1 clearly looks like a stylized 3D primitive model with smooth tubes, a detached neck base, a sharp two-tone horizon, and an UI banner, so it could not pass for the reference photo at first glance.", "jo": ""}, {"n": "30", "d": "Lighting", "c": "Soft shadows fall under the wing and along the neck, matching the sun direction", "h": true, "hc": "The body casts soft shadows under the wing and along the neck, from the same sun.", "j": false, "v": 1, "k": 5, "jc": "Because the wing covert is embedded into the side of the torso (wingGroup z = 0.25 inside bodyMesh half-width 0.336), Screenshot 1 shows a thin, jagged intersection sliver beneath the wing rather than a soft cast shadow.", "jo": "Screenshot 1 shows a soft shadow cast immediately beneath the wing covert onto the flank and smooth directional shading along the underside of the S-curved neck matching the front-right sun."}], "note": "", "runs": [19, 19, 19, 21, 21], "pair": 0.9575757575757575, "mean": 19.8, "sd": 0.9797958971132712, "kappa": 0.9116161616161618}];
const STATS = {"pair": 0.9536585365853658, "runs": [5], "kappa": 0.9059740855406492, "cats": [{"d": "Builds", "n": 10, "unan": 10, "agree": 10, "scored": 10}, {"d": "Orbit", "n": 5, "unan": 4, "agree": 3, "scored": 5}, {"d": "Prompt Adherence", "n": 10, "unan": 10, "agree": 10, "scored": 10}, {"d": "Composition", "n": 10, "unan": 9, "agree": 9, "scored": 10}, {"d": "Reference Fidelity", "n": 22, "unan": 20, "agree": 19, "scored": 22}, {"d": "Scene Fidelity", "n": 25, "unan": 22, "agree": 20, "scored": 25}, {"d": "Lighting", "n": 20, "unan": 17, "agree": 12, "scored": 20}, {"d": "Materials", "n": 20, "unan": 19, "agree": 13, "scored": 20}, {"d": "Motion", "n": 21, "unan": 20, "agree": 18, "scored": 21}, {"d": "Realism", "n": 21, "unan": 17, "agree": 15, "scored": 21}]};
const ICON_BOX = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';
const page = document.getElementById('page');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mark = v => v === true ? '<span class="yes" aria-label="Pass">&#10003;</span>' : v === false ? '<span class="no" aria-label="Fail">&#10007;</span>' : '<span class="na" aria-label="Not scored">&ndash;</span>';
const passes = (rows, k) => rows.some(r => r[k] !== null && r[k] !== undefined) ? `${rows.filter(r => r[k] === true).length} / ${rows.length}` : '&ndash;';
const both = r => typeof r.h === 'boolean' && typeof r.j === 'boolean';
const agreeText = rows => { const b = rows.filter(both); return b.length ? `${b.filter(r => r.h === r.j).length} / ${b.length}` : '&ndash;'; };
const capName = p => p.split('/').pop().replace(/^\d+_/, '').replace('.jpg', '').replace(/_/g, ' ');

document.getElementById('menu').innerHTML = SAMPLES.map(s => `<a href="#${s.id}" data-id="${s.id}">${ICON_BOX}<span>${esc(s.name)}</span></a>`).join('');

const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '&ndash;';
const pct1 = x => x === null || x === undefined ? '&ndash;' : (100 * x).toFixed(1) + '%';
const kfmt = k => k === null || k === undefined ? '&ndash;' : k.toFixed(2);

function renderOverview() {
  const results = SAMPLES.map(s => {
    const k = s.runs.length, unan = s.rows.filter(r => r.k && (r.v === 0 || r.v === r.k)).length;
    const lo = Math.min(...s.runs), hi = Math.max(...s.runs);
    return `<tr><td><a href="#${s.id}" style="text-decoration:none">${esc(s.name)}</a></td><td class="mono">${passes(s.rows, 'h')}</td>`
      + `<td class="mono">${k ? `${s.mean.toFixed(1)} (${s.sd.toFixed(1)})` : '&ndash;'}</td><td class="mono">${k ? (lo === hi ? lo : `${lo}&ndash;${hi}`) : '&ndash;'}</td>`
      + `<td class="mono">${k > 1 ? pct1(s.pair) : '&ndash;'}</td><td class="mono">${k ? `${unan} / ${s.rows.length}` : '&ndash;'}</td><td class="mono">${kfmt(s.kappa)}</td><td class="mono">${agreeText(s.rows)}</td></tr>`;
  }).join('');
  const cats = STATS.cats.map(c => `<tr><td>${esc(c.d)}</td><td class="mono">${c.n}</td><td class="mono">${pct(c.unan, c.n)}</td><td class="mono">${pct(c.agree, c.scored)}</td></tr>`).join('');
  const all = SAMPLES.flatMap(s => s.rows).filter(r => r.k);
  const unanAll = all.filter(r => r.v === 0 || r.v === r.k).length;
  const runsLabel = STATS.runs.length === 1 ? `${STATS.runs[0]} runs` : 'runs';
  page.className = 'doc wide';
  page.innerHTML = `
    <h1 class="home">Rubrics</h1>
    <p class="lead">Five photos, each turned into a 3D scene by ${esc(MODEL)} from one prompt, then scored against its rubric by a human review and by ${esc(MODEL)} as a judge, ${runsLabel} per scene.</p>
    <div class="label refs-label">Reference images</div>
    <div class="refs">${SAMPLES.map(s => `<a href="#${s.id}"><img src="${esc(s.thumb)}" alt="Reference photo: ${esc(s.name)}" loading="lazy"><span class="label">${esc(s.name)}</span></a>`).join('')}</div>
    <h2>How it was scored</h2>
    <p class="note">Human: Claude Opus 5.5, acting as the human reviewer, scored each scene from captures of the running scene and its code, before Carbon graded it. Carbon: given the reference photo, five screenshots (default view, orbit left, orbit right, from above, zoomed out) and the scene's HTML, with the rubric. Each Carbon run is a separate request with no shared history, at temperature 0, on one provider (Google AI Studio). Carbon's verdict is the majority of its runs; an even split is shown as a tie.</p>
    <h2>Consistency</h2>
    <p class="note">${all.length ? `Any two Carbon runs gave the same verdict on ${pct1(STATS.pair)} of criteria. Every run agreed on ${unanAll} of ${all.length} criteria (${pct(unanAll, all.length)}). Fleiss' kappa across all runs: ${kfmt(STATS.kappa)} (1 means the runs always agree).` : 'Carbon runs pending.'}</p>
    <div class="table-wrap"><table class="rubric plain"><thead><tr><th>Sample</th><th>Human</th><th>Carbon mean (SD)</th><th>Range</th><th>Pairwise agree</th><th>Unanimous</th><th>Kappa</th><th>Majority vs human</th></tr></thead><tbody>${results}</tbody></table></div>
    <h2>By category</h2>
    <div class="table-wrap"><table class="rubric plain"><thead><tr><th>Category</th><th>Criteria</th><th>Unanimous across runs</th><th>Majority agrees with human</th></tr></thead><tbody>${cats}</tbody></table></div>`;
}

function rubricTable(rows) {
  const order = [];
  rows.forEach(r => { if (!order.includes(r.d)) order.push(r.d); });
  const body = order.map(d => `<tr class="grp"><th colspan="5">${esc(d)}</th></tr>` + rows.filter(r => r.d === d).map(r => {
    const dis = both(r) && r.h !== r.j, split = r.k && r.v !== 0 && r.v !== r.k;
    const cls = [dis ? 'dis' : (split ? 'agree splitrow' : 'agree'), r.n.startsWith('G') ? 'gate' : ''].join(' ');
    const cm = (r.hc ? `<p class="cl"><span class="src">Human</span> ${esc(r.hc)}</p>` : '')
      + (r.jc ? `<p class="cl"><span class="src">Carbon${split ? (r.j === null ? ' &middot; pass' : ' &middot; majority') : ''}</span> ${esc(r.jc)}</p>` : '')
      + (split && r.jo ? `<p class="cl"><span class="src">Carbon &middot; ${r.j === null ? 'fail' : 'minority'}</span> ${esc(r.jo)}</p>` : '');
    const votes = r.k ? `${r.v}/${r.k} pass${split ? `<br><span class="split">${r.j === null ? 'tie' : 'split'}</span>` : ''}` : '&ndash;';
    return `<tr class="${cls}"><td><strong>${esc(r.n)}</strong> &mdash; ${esc(r.c)}</td><td class="c">${mark(r.h)}</td><td class="c">${mark(r.j)}</td><td class="c votes">${votes}</td><td class="cm">${cm}</td></tr>`;
  }).join('')).join('');
  return `<div class="legend label"><span><i style="background:rgba(63,140,232,.5)"></i>Gate</span><span><i style="background:rgba(248,113,113,.6)"></i>Carbon majority disagrees with human</span><span><i style="background:#E8BE3F"></i>Runs split</span></div>
    <label class="page-filter label"><input type="checkbox" class="only-dis-box"> Show disagreements and splits only</label>
    <div class="table-wrap judge-wrap"><table class="rubric merged judge"><thead><tr><th>Rubric</th><th>Human</th><th>Carbon</th><th>Runs</th><th>Comments</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderSample(s) {
  page.className = 'doc wide';
  const scene = s.model
    ? `<div class="frame"><iframe data-src="${esc(s.model)}" title="${esc(MODEL)} scene" allow="fullscreen" allowfullscreen></iframe><div class="loading" aria-live="polite"><span class="spin" aria-hidden="true"></span><span class="label">Loading</span></div></div>`
    : `<div class="frame"><div class="pending">Scene pending</div></div>`;
  page.innerHTML = `
    <header class="title-row"><div><h1>${esc(s.name)}</h1><div class="label">${s.rows.length} criteria &middot; Human ${passes(s.rows, 'h')} &middot; Carbon ${s.runs.length ? `${s.mean.toFixed(1)} on average (${Math.min(...s.runs)}&ndash;${Math.max(...s.runs)}) over ${s.runs.length} runs` : '&ndash;'}</div></div></header>
    <div class="prompt"><img src="${esc(s.thumb)}" alt="Reference photo sent with the prompt"><div><div class="label">Prompt &middot; sent with the reference photo</div><p>${esc(PROMPT)}</p></div></div>
    <section class="pair">
      <figure class="pane"><div class="pane-head"><span class="label">${esc(MODEL)}</span>${s.model ? `<a href="${esc(s.model)}" target="_blank" rel="noopener">Open full screen</a>` : ''}</div>${scene}</figure>
      <figure class="pane"><div class="pane-head"><span class="label">Reference photo</span><a href="${esc(s.ref)}" target="_blank" rel="noopener">Open full size</a></div><div class="ref-frame"><img src="${esc(s.ref)}" alt="Reference photo: ${esc(s.name)}"></div></figure>
    </section>
    ${s.note ? `<p class="gen-note">${esc(s.note)}</p>` : ''}
    ${s.caps.length ? `<details class="sec"><summary><h2>Captures</h2><span class="label">${s.caps.length} views &middot; what both reviews saw</span></summary><div class="caps">${s.caps.map(c => `<a href="${esc(c)}" target="_blank" rel="noopener"><img src="${esc(c)}" alt="${esc(capName(c))}" loading="lazy"><span class="label">${esc(capName(c))}</span></a>`).join('')}</div></details>` : ''}
    <details class="sec" open><summary><h2>Rubrics</h2><span class="label">${agreeText(s.rows)} agree with human</span></summary>${rubricTable(s.rows)}</details>`;
  page.querySelectorAll('.only-dis-box').forEach(b => b.addEventListener('change', () => {
    const wrap = page.querySelector('.judge-wrap');
    wrap.classList.toggle('only-dis', b.checked);
    // hide category headers whose rows are all filtered out
    wrap.querySelectorAll('tr.grp').forEach(g => {
      let shown = false;
      for (let r = g.nextElementSibling; r && !r.classList.contains('grp'); r = r.nextElementSibling) if (getComputedStyle(r).display !== 'none') shown = true;
      g.hidden = b.checked && !shown;
    });
  }));
  page.querySelectorAll('.frame iframe[data-src]').forEach(f => {
    const cover = f.parentElement.querySelector('.loading');
    f.addEventListener('load', () => { if (f.src && f.src !== 'about:blank') setTimeout(() => cover.classList.add('done'), 600); });
    f.src = f.dataset.src;
  });
}

function render() {
  const id = location.hash.slice(1);
  const s = SAMPLES.find(x => x.id === id);
  document.querySelectorAll('.side a[data-id]').forEach(a => { if (a.dataset.id === (s ? s.id : 'overview')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (s) renderSample(s); else renderOverview();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
